# Dokploy / Nixpacks build for the Bedrock monorepo.
# We only ship the web app (apps/web) for now. Catalog API + Query Service
# get their own deploy pipelines once their endpoints land.

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-9_x"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @bedrock/web build"]

[start]
cmd = "pnpm start"
