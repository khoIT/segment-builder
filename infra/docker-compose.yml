# Local dev: Postgres only. Nest apps + Vite run natively for hot
# reload. Full-stack-in-containers profile lives in
# docker-compose.fullstack.yml for CI / staging-parity testing.
services:
  postgres:
    image: postgres:16
    container_name: bedrock_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: bedrock
      POSTGRES_USER: bedrock
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - bedrock_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bedrock -d bedrock"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bedrock_pg: {}
